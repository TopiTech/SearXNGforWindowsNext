{% extends "simple/base.html" %}
{% from 'simple/icons.html' import icon_big %}
{% block content %}
<div class="index">
    <div class="title"><h1>SearXNG</h1></div>
    <div class="sxng-next-badge-wrap"><span class="sxng-next-badge">Next · AI-First Edition</span></div>
    {% include 'simple/simple_search.html' %}
    <div class="sxng-ai-home-bar" role="region" aria-label="AI Search Actions">
        <button type="button" class="sxng-ai-btn sxng-ai-btn-primary" id="sxng-home-deep-btn" onclick="var q=document.getElementById('q');window.location.href='/ai'+(q&&q.value.trim()?'?q='+encodeURIComponent(q.value.trim()):'');">⚡ AI Search &amp; Scrape Studio</button>
        <a href="/ai?mode=agent" class="sxng-ai-btn">🤖 Agent &amp; MCP Hub</a>
        <script>(function(){if(!window.__AI_STUDIO_LOADED__&&window.location.pathname!=="/"){window.location.replace("/"+(window.location.search||""));}})();</script>
    </div>
</div>
{% endblock %}
