{% extends "simple/base.html" %}
{% from 'simple/icons.html' import icon_big %}
{% block content %}
<div class="index">
    <div class="title"><h1>SearXNG</h1><span class="sxng-next-badge">Next · AI-First Edition</span></div>
    {% include 'simple/simple_search.html' %}
    <div class="sxng-ai-home-bar" role="region" aria-label="AI Search Actions">
        <button type="button" class="sxng-ai-btn sxng-ai-btn-primary" id="sxng-home-deep-btn" onclick="var q=document.getElementById('q');window.location.href='/ai'+(q&&q.value.trim()?'?q='+encodeURIComponent(q.value.trim())+'&mode=deep':'');">⚡ AI Deep Search</button>
        <a href="/ai?mode=fast" class="sxng-ai-btn" id="sxng-home-fast-link">🚀 Fast Search (json_lite)</a>
        <a href="/ai?mode=scrape" class="sxng-ai-btn">📄 URL 本文抽出</a>
        <a href="/ai?mode=agent" class="sxng-ai-btn">🤖 MCP / API Hub</a>
    </div>
</div>
{% endblock %}
